<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mô hình định dạng văn bản</title>
  <style>
    :root{--highlight:#ffeb3b}
    body{font-family:Segoe UI, Roboto, Arial, sans-serif;padding:32px;background:#f7f7f7;color:#222}
    h1{font-size:2rem;margin:0 0 12px}
    h2{font-size:1.5rem;margin:0 0 12px}
    p{margin:0 0 12px;color:#333}
    .highlight{background:var(--highlight);font-weight:700;padding:2px 6px;border-radius:4px}
    .note{font-size:.9rem;color:#666;margin-top:18px}
  </style>
</head>
<body>
  <h1>Tiêu đề H1: <span class="highlight">Điểm nhấn nền vàng</span></h1>
  <h2>Tiêu đề H2: <span class="highlight">Chữ đậm và nổi bật</span></h2>
  <p>Đoạn văn (P): <span class="highlight">Từ nhấn mạnh</span> trong câu mô tả.</p>

  <p class="note">Lưu ý: Dùng thẻ <span class="highlight">span</span> với class <strong>highlight</strong> để tô nền và làm chữ đậm.</p>
</body>
</html>
